<div class="shell">
  <header class="top-bar">
    <div class="brand">DailyTracker</div>

    <nav class="nav">
      <a routerLink="/items" routerLinkActive="active">Items</a>
      <!-- future: <a routerLink="/transactions" routerLinkActive="active">Transactions</a> -->
    </nav>

    @if (user(); as u) {
      <div class="user-info">
        <span>Hi, <strong>{{ u.username }}</strong> ({{ u.role }})</span>
        <button class="logout" (click)="logout()">Logout</button>
      </div>
    }
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
