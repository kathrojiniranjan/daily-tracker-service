<div class="shell">
  <header class="top-bar">
    <a class="brand" routerLink="/home" aria-label="DailyTracker home">
      <img class="logo" src="/images/logo.png" alt="DailyTracker logo" />
      <span class="brand-text">DailyTracker</span>
    </a>

    <nav class="nav">
      <a routerLink="/home" routerLinkActive="active">Home</a>
      <a routerLink="/items" routerLinkActive="active">Items</a>
      <a routerLink="/transactions" routerLinkActive="active">Transactions</a>
      @if (isAdmin()) {
        <a routerLink="/admin/users" routerLinkActive="active">Users</a>
      }
    </nav>

    @if (user(); as u) {
      <div class="user-info">
        <span
          >Hi, <strong>{{ u.username }}</strong> <span class="role-tag">({{ u.role }})</span></span
        >
        <button class="logout" (click)="logout()">Logout</button>
      </div>
    }
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
